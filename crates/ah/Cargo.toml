[package]
name = "ah"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "ah"

[[bin]]
name = "ah"
path = "src/main.rs"

[dependencies]
ah-abi = { path = "../ah-abi" }
ah-core = { path = "../ah-core" }
ah-voice = { path = "../ah-voice", default-features = false }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", default-features = false, features = ["events"] }
unicode-width = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
dirs = "7"

[features]
default = ["mic", "live"]
# Record from the system microphone. Off, `/voice` needs a recorder on PATH
# or `voice.capture_cmd`, and nothing links an audio library.
mic = ["ah-voice/mic"]
# Dictation against Deepgram's live socket. Off, only the OpenRouter routes
# are offered and no TLS client but `ureq`'s is linked.
live = ["ah-voice/live"]
