[package]
name = "ah-remote"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The encrypted link between an ah session and a phone, through a relay that only ever sees ciphertext"

[dependencies]
ah-remote-proto = { path = "../ah-remote-proto" }
serde_json = { workspace = true, features = ["std"] }
# Already compiled as rustls's provider, so none of this is a new download.
# This crate is the first to use its aead, hkdf, hmac and rand modules.
ring = "0.17"
# Already compiled: tungstenite uses it for the handshake key.
data-encoding = "2"
# The same selection `ah-voice` makes: the root store comes from the copy
# `ureq` already pulls in rather than a second one bundled alongside it.
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "__rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# The same HTTP client `ah-core` already links, for the one plain request
# pairing makes.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
# Already compiled as rustls's own way of clearing TLS key material, so none of
# this is a new download. Every wipe in this crate goes through it: a plain
# assignment or an unfenced `write_bytes` is deleted outright by the release
# profile (opt-level 3, fat LTO), and only a volatile write survives.
zeroize = "1"
