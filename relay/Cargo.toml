# A workspace of its own, like `plugins/`: this crate only ever builds for
# wasm32-unknown-unknown, and its release profile is tuned for the Worker
# bundle limit rather than for the speed the harness wants.
[workspace]

[package]
name = "ah-relay"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The relay an ah session and a phone meet at, which can read neither of them"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The wire format, shared with the harness so the two cannot disagree.
ah-remote-proto = { path = "../crates/ah-remote-proto" }
worker = { version = "0.8", features = ["http"] }
worker-macros = { version = "0.8", features = ["http"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The runtime's own HMAC. Nothing else here does crypto, and `ring` on wasm32
# would cost a C toolchain and a few hundred kilobytes to check one signature.
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Crypto", "SubtleCrypto", "CryptoKey"] }
console_error_panic_hook = "0.1"


[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
# Deliberately no `strip`: cargo strips custom sections along with symbols, and
# `target_features` is one of them. Without it wasm-bindgen cannot tell that
# reference types are available, and stops at "externref table required for
# catch wrappers" — with nothing to suggest the profile is what did it.
# wasm-opt strips what is worth stripping later anyway.
panic = "abort"
